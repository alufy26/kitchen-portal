<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物リスト</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <a class="home-link" href="index.html" aria-label="ポータルに戻る">⌂</a>
      <div>
        <div class="eyebrow">SHOPPING LIST</div>
        <h1>買い物リスト</h1>
      </div>
    </div>
    <div class="count-badge">
      <div class="count-num" id="remainCount">-</div>
      <div class="count-label">件 未購入</div>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:16px;">
    <input id="quickAdd" placeholder="買うものを入力してEnter">
  </div>

  <div id="list"><div class="loading">読み込み中…</div></div>
  <div class="error-banner" id="errorBanner"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal fade" id="modalBox">
      <div class="modal-title" id="modalTitle">アイテムを編集</div>
      <label class="field-label">品名</label>
      <input id="fName">
      <label class="field-label">数量</label>
      <input id="fQuantity" placeholder="例：2個、1パック">
      <label class="field-label">メモ（任意）</label>
      <textarea id="fMemo" style="height:56px; resize:none;" placeholder="例：〇〇のレシピ用"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDelete" style="color:#C55A1E;border-color:#F2D9A0;">削除する</button>
        <button class="btn-save" id="btnSave">更新する</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
const SHEET = "ShoppingList";
let items = [];
let editingId = null;

function toBool(v) { return v === true || v === "true" || v === "TRUE"; }
function escapeHtml(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showError(msg) {
  const el = document.getElementById("errorBanner");
  if (!msg) { el.style.display = "none"; return; }
  el.textContent = msg; el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function loadItems() {
  try {
    const data = await Api.list(SHEET);
    items = data.map(it => ({ ...it, checked: toBool(it.checked) }));
  } catch (e) { showError("読み込みに失敗しました: " + e.message); items = []; }
  renderList();
}

function renderList() {
  const listEl = document.getElementById("list");
  const unchecked = items.filter(i => !i.checked);
  const checked = items.filter(i => i.checked);
  document.getElementById("remainCount").textContent = unchecked.length;

  if (items.length === 0) {
    listEl.innerHTML = `<div class="empty-state">買い物リストは空です。<br>上の入力欄から追加しましょう。</div>`;
    return;
  }
  let html = "";
  if (unchecked.length > 0) {
    html += unchecked.map(cardHtml).join("");
  } else {
    html += `<div class="empty-state">未購入のアイテムはありません。</div>`;
  }
  if (checked.length > 0) {
    html += `<div style="font-size:12px;font-weight:900;color:#8AA5A9;margin:16px 0 6px;">購入済み（${checked.length}）</div>`;
    html += checked.map(cardHtml).join("");
  }
  listEl.innerHTML = html;

  listEl.querySelectorAll("[data-toggle]").forEach(cb => cb.addEventListener("click", async (e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === cb.dataset.toggle);
    try { await Api.update(SHEET, item.id, { checked: !item.checked }); await loadItems(); }
    catch (err) { showError("更新に失敗しました: " + err.message); }
  }));
  listEl.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => {
    const item = items.find(i => i.id === card.dataset.id);
    if (item) openEdit(item);
  }));
}

function cardHtml(it) {
  return `<div class="card" data-id="${it.id}" style="${it.checked ? 'opacity:0.55;' : ''}">
    <input type="checkbox" data-toggle="${it.id}" ${it.checked ? "checked" : ""} style="width:20px;height:20px;flex-shrink:0;">
    <div style="flex:1; min-width:0;">
      <div class="card-name" style="${it.checked ? 'text-decoration:line-through;' : ''}">${escapeHtml(it.name)}</div>
      <div class="card-meta">${escapeHtml(it.quantity) || ""}</div>
      ${it.memo ? `<div class="card-memo">${escapeHtml(it.memo)}</div>` : ""}
    </div>
  </div>`;
}

function openModal() { document.getElementById("modalOverlay").classList.add("open"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

function openEdit(item) {
  editingId = item.id;
  document.getElementById("fName").value = item.name;
  document.getElementById("fQuantity").value = item.quantity || "";
  document.getElementById("fMemo").value = item.memo || "";
  openModal();
}

async function quickAdd(name) {
  if (!name.trim()) return;
  try {
    await Api.add(SHEET, { name: name.trim(), quantity: "", memo: "", checked: false, addedDate: new Date().toISOString().slice(0,10) });
    await loadItems();
  } catch (err) { showError("追加に失敗しました: " + err.message); }
}

async function saveForm() {
  const name = document.getElementById("fName").value.trim();
  if (!name) return;
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  try {
    await Api.update(SHEET, editingId, {
      name,
      quantity: document.getElementById("fQuantity").value.trim(),
      memo: document.getElementById("fMemo").value.trim(),
    });
    closeModal();
    await loadItems();
  } catch (err) { showError("保存に失敗しました: " + err.message); }
  finally { btn.disabled = false; }
}

async function deleteItem() {
  try { await Api.remove(SHEET, editingId); closeModal(); await loadItems(); }
  catch (err) { showError("削除に失敗しました: " + err.message); }
}

document.getElementById("quickAdd").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    quickAdd(e.target.value);
    e.target.value = "";
  }
});
document.getElementById("btnSave").addEventListener("click", saveForm);
document.getElementById("btnDelete").addEventListener("click", deleteItem);
document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") closeModal(); });

loadItems();
</script>
</body>
</html>
