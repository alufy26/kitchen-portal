<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買い物リスト</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <a class="home-link" href="index.html" aria-label="ポータルに戻る">⌂</a>
      <div>
        <div class="eyebrow">SHOPPING LIST</div>
        <h1>買い物リスト</h1>
      </div>
    </div>
    <div class="count-badge">
      <div class="count-num" id="remainCount">-</div>
      <div class="count-label">件 未購入</div>
    </div>
  </div>

  <div style="background:#fff; border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(27,122,140,0.08); margin-bottom:16px; border:1px solid #DCEFF0;">
    <div style="font-size:12px; color:#3E6B72; font-weight:700; margin-bottom:8px;">レシピから買い物候補を作る（週2回・在庫にないものだけ表示）</div>
    <div class="tabs" id="periodTabs" style="margin-bottom:4px;"></div>
    <div id="candidateStatus" style="font-size:12px; color:#8AA5A9; padding:6px 2px;"></div>
    <div id="candidateList"></div>
    <button id="btnAddCandidates" style="width:100%; margin-top:10px; padding:11px 0; border-radius:10px; border:none; background:#1B7A8C; color:#fff; font-weight:700; cursor:pointer;">
      チェックした候補を買い物リストに追加
    </button>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:16px;">
    <input id="quickAdd" placeholder="買うものを入力してEnter">
  </div>

  <div id="list"><div class="loading">読み込み中…</div></div>
  <div class="error-banner" id="errorBanner"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal fade" id="modalBox">
      <div class="modal-title" id="modalTitle">アイテムを編集</div>
      <label class="field-label">品名</label>
      <input id="fName">
      <label class="field-label">数量</label>
      <input id="fQuantity" placeholder="例：2個、1パック">
      <label class="field-label">メモ（任意）</label>
      <textarea id="fMemo" style="height:56px; resize:none;" placeholder="例：〇〇のレシピ用"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDelete" style="color:#C55A1E;border-color:#F2D9A0;">削除する</button>
        <button class="btn-save" id="btnSave">更新する</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/site-config.js"></script>
<script src="assets/api.js"></script>
<script>
const SHEET = "ShoppingList";
let items = [];
let editingId = null;
let fridgeItems = [];
let candidates = []; // {key, name, entries:[{day,amount}], inStock, alreadyListed, checked}

const PERIODS = [
  { id: "mon-thu", label: "月〜木", days: ["mon","tue","wed","thu"] },
  { id: "fri-sun", label: "金〜日", days: ["fri","sat","sun"] },
];
const DAY_LABEL = { mon:"月", tue:"火", wed:"水", thu:"木", fri:"金", sat:"土", sun:"日" };
let currentPeriod = (() => {
  const idx = new Date().getDay(); // 0:日 1:月 ... 6:土
  return (idx >= 1 && idx <= 4) ? "mon-thu" : "fri-sun";
})();

function toBool(v) { return v === true || v === "true" || v === "TRUE"; }
function escapeHtml(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s) { return (s||"").toString().trim().toLowerCase(); }

function showError(msg) {
  const el = document.getElementById("errorBanner");
  if (!msg) { el.style.display = "none"; return; }
  el.textContent = msg; el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function loadItems() {
  try {
    const data = await Api.list(SHEET);
    items = data.map(it => ({ ...it, checked: toBool(it.checked) }));
  } catch (e) { showError("読み込みに失敗しました: " + e.message); items = []; }
  renderList();
}

function renderList() {
  const listEl = document.getElementById("list");
  const unchecked = items.filter(i => !i.checked);
  const checked = items.filter(i => i.checked);
  document.getElementById("remainCount").textContent = unchecked.length;

  if (items.length === 0) {
    listEl.innerHTML = `<div class="empty-state">買い物リストは空です。<br>上の入力欄から追加しましょう。</div>`;
    return;
  }
  let html = "";
  if (unchecked.length > 0) {
    html += unchecked.map(cardHtml).join("");
  } else {
    html += `<div class="empty-state">未購入のアイテムはありません。</div>`;
  }
  if (checked.length > 0) {
    html += `<div style="font-size:12px;font-weight:900;color:#8AA5A9;margin:16px 0 6px;">購入済み（${checked.length}）</div>`;
    html += checked.map(cardHtml).join("");
  }
  listEl.innerHTML = html;

  listEl.querySelectorAll("[data-toggle]").forEach(cb => cb.addEventListener("click", async (e) => {
    e.stopPropagation();
    const item = items.find(i => i.id === cb.dataset.toggle);
    try { await Api.update(SHEET, item.id, { checked: !item.checked }); await loadItems(); }
    catch (err) { showError("更新に失敗しました: " + err.message); }
  }));
  listEl.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => {
    const item = items.find(i => i.id === card.dataset.id);
    if (item) openEdit(item);
  }));
}

function cardHtml(it) {
  return `<div class="card" data-id="${it.id}" style="${it.checked ? 'opacity:0.55;' : ''}">
    <input type="checkbox" data-toggle="${it.id}" ${it.checked ? "checked" : ""} style="width:20px;height:20px;flex-shrink:0;">
    <div style="flex:1; min-width:0;">
      <div class="card-name" style="${it.checked ? 'text-decoration:line-through;' : ''}">${escapeHtml(it.name)}</div>
      <div class="card-meta">${escapeHtml(it.quantity) || ""}</div>
      ${it.memo ? `<div class="card-memo">${escapeHtml(it.memo)}</div>` : ""}
    </div>
  </div>`;
}

function openModal() { document.getElementById("modalOverlay").classList.add("open"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

function openEdit(item) {
  editingId = item.id;
  document.getElementById("fName").value = item.name;
  document.getElementById("fQuantity").value = item.quantity || "";
  document.getElementById("fMemo").value = item.memo || "";
  openModal();
}

async function quickAdd(name) {
  if (!name.trim()) return;
  try {
    await Api.add(SHEET, { name: name.trim(), quantity: "", memo: "", checked: false, addedDate: new Date().toISOString().slice(0,10) });
    await loadItems();
    renderCandidates();
  } catch (err) { showError("追加に失敗しました: " + err.message); }
}

async function saveForm() {
  const name = document.getElementById("fName").value.trim();
  if (!name) return;
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  try {
    await Api.update(SHEET, editingId, {
      name,
      quantity: document.getElementById("fQuantity").value.trim(),
      memo: document.getElementById("fMemo").value.trim(),
    });
    closeModal();
    await loadItems();
  } catch (err) { showError("保存に失敗しました: " + err.message); }
  finally { btn.disabled = false; }
}

async function deleteItem() {
  try { await Api.remove(SHEET, editingId); closeModal(); await loadItems(); }
  catch (err) { showError("削除に失敗しました: " + err.message); }
}

document.getElementById("quickAdd").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    quickAdd(e.target.value);
    e.target.value = "";
  }
});
document.getElementById("btnSave").addEventListener("click", saveForm);
document.getElementById("btnDelete").addEventListener("click", deleteItem);
document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") closeModal(); });

/* ---------- レシピから買い物候補を作る ---------- */

function parseIngredientLine(line) {
  const s = line.replace(/^[-*]\s*/, "").trim();
  // 「品名：分量」（全角/半角コロン区切り）
  let m = s.match(/^(.+?)[：:]\s*(.+)$/);
  if (m) return { name: m[1].trim(), amount: m[2].trim() };
  // 「品名 分量」（スペース区切り、分量が数字や「少々」等で始まる）
  m = s.match(/^(.+?)[\s　]+([0-9０-９].*|少々|適量|お好みで.*|ひとつまみ.*|大さじ.*|小さじ.*)$/);
  if (m) return { name: m[1].trim(), amount: m[2].trim() };
  return { name: s, amount: "" };
}

function looksLikeIngredientLine(s) {
  if (/[。！？]$/.test(s)) return false; // 文章っぽい行（句点等で終わる）は対象外
  return /[：:]/.test(s);
}

const MATERIAL_END_KEYWORDS_RE = /作り方|下準備|ポイント|注意|コツ|アレンジ|保存|使い方|調理の流れ|工程|手順/;

function extractIngredients(mdText) {
  const lines = mdText.split(/\r?\n/);
  const out = [];
  let capturing = false;
  for (const line of lines) {
    const trimmed = line.trim();
    // 見出し形式（## 材料 / ### 材料（1人分） / ### 【材料】 など）か、
    // 見出し記号なしの単独行「【材料】」を「材料欄の開始」として扱う。
    const isTrigger = /材料/.test(trimmed) && (
      /^#{1,6}\s*/.test(trimmed) ||
      /^[【\[]?\s*材料\s*[】\]]?\s*[:：]?$/.test(trimmed)
    );
    if (isTrigger) { capturing = true; continue; }
    if (!capturing) continue;
    if (trimmed === "") continue; // 空行はスキップ（区切りとはみなさない）
    if (/^#{1,6}\s/.test(trimmed)) {
      // 材料欄の途中に出てくる小見出し（例：### 基本の具材）はスキップして続行。
      // 「作り方」「下準備」などが来たら、そこで材料欄は終わり。
      if (MATERIAL_END_KEYWORDS_RE.test(trimmed)) capturing = false;
      continue;
    }
    if (/^[-*]\s+\S/.test(trimmed)) {
      out.push(parseIngredientLine(trimmed));
    } else if (looksLikeIngredientLine(trimmed)) {
      // 箇条書き記号なしで「品名：分量」だけが1行ずつ並んでいる形式にも対応
      out.push(parseIngredientLine(trimmed));
    } else {
      capturing = false; // それ以外の文章（作り方の説明等）が来たら材料欄は終わり
    }
  }
  return out;
}

function isInStock(name) {
  const q = normalize(name);
  return fridgeItems.some(fi => {
    const fn = normalize(fi.name);
    return fn && (fn.includes(q) || q.includes(fn));
  });
}
function isAlreadyListed(name) {
  const q = normalize(name);
  return items.some(it => !it.checked && normalize(it.name) === q);
}

async function loadFridgeStock() {
  try { fridgeItems = await Api.list("FridgeItems"); }
  catch (e) { fridgeItems = []; }
}

async function buildCandidates() {
  const statusEl = document.getElementById("candidateStatus");
  statusEl.textContent = "レシピを読み込み中…";
  const period = PERIODS.find(p => p.id === currentPeriod);
  const grouped = {}; // normalized name -> {name, entries:[]}
  let missingFiles = [];

  for (const day of period.days) {
    try {
      const res = await fetch(`./recipes/${day}.md?_=${Date.now()}`);
      if (!res.ok) { missingFiles.push(day); continue; }
      const text = await res.text();
      const ingredients = extractIngredients(text);
      ingredients.forEach(ing => {
        if (!ing.name) return;
        const key = normalize(ing.name);
        if (!grouped[key]) grouped[key] = { name: ing.name, entries: [] };
        grouped[key].entries.push({ day, amount: ing.amount });
      });
    } catch (e) { missingFiles.push(day); }
  }

  candidates = Object.values(grouped).map(c => {
    const inStock = isInStock(c.name);
    const alreadyListed = isAlreadyListed(c.name);
    return { ...c, inStock, alreadyListed, checked: !inStock && !alreadyListed };
  });

  if (candidates.length === 0) {
    statusEl.textContent = missingFiles.length === period.days.length
      ? "この期間のレシピ(.md)がまだ用意されていません。recipesフォルダにファイルを追加してください。"
      : "この期間のレシピに「## 材料」欄の食材が見つかりませんでした。";
  } else {
    statusEl.textContent = "";
  }
  renderCandidates();
}

function renderPeriodTabs() {
  document.getElementById("periodTabs").innerHTML = PERIODS.map(p =>
    `<div class="tab ${currentPeriod===p.id?'active':''}" data-period="${p.id}">${p.label}</div>`
  ).join("");
  document.querySelectorAll("#periodTabs .tab").forEach(t => t.addEventListener("click", () => {
    currentPeriod = t.dataset.period;
    renderPeriodTabs();
    buildCandidates();
  }));
}

function renderCandidates() {
  const el = document.getElementById("candidateList");
  if (candidates.length === 0) { el.innerHTML = ""; return; }
  el.innerHTML = candidates.map((c, i) => {
    const detail = c.entries.map(e => `${DAY_LABEL[e.day]}${e.amount ? "："+escapeHtml(e.amount) : ""}`).join("　");
    const tags = [];
    if (c.inStock) tags.push(`<span class="tag" style="background:#E7F3E4;color:#5C8A4E;">在庫あり</span>`);
    if (c.alreadyListed) tags.push(`<span class="tag">追加済み</span>`);
    return `<label style="display:flex; align-items:flex-start; gap:10px; padding:8px 2px; border-bottom:1px solid #EAF4F4; cursor:pointer;">
      <input type="checkbox" data-idx="${i}" ${c.checked ? "checked" : ""} style="width:18px;height:18px;margin-top:2px;flex-shrink:0;">
      <span style="flex:1;">
        <span style="font-weight:700;color:#16333A;">${escapeHtml(c.name)}</span>${tags.join("")}
        <div style="font-size:12px;color:#8AA5A9;margin-top:2px;">${detail}</div>
      </span>
    </label>`;
  }).join("");
  el.querySelectorAll("[data-idx]").forEach(cb => cb.addEventListener("change", (e) => {
    candidates[Number(e.target.dataset.idx)].checked = e.target.checked;
  }));
}

async function addCheckedCandidates() {
  const toAdd = candidates.filter(c => c.checked);
  if (toAdd.length === 0) return;
  const btn = document.getElementById("btnAddCandidates");
  btn.disabled = true;
  btn.textContent = "追加中…";
  try {
    for (const c of toAdd) {
      const quantity = c.entries.map(e => `${DAY_LABEL[e.day]}:${e.amount||"適量"}`).join(" / ");
      await Api.add(SHEET, {
        name: c.name,
        quantity,
        memo: "夕食レシピより自動追加",
        checked: false,
        addedDate: new Date().toISOString().slice(0,10),
      });
    }
    await loadItems();
    await buildCandidates();
  } catch (err) {
    showError("候補の追加に失敗しました: " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "チェックした候補を買い物リストに追加";
  }
}
document.getElementById("btnAddCandidates").addEventListener("click", addCheckedCandidates);

async function initPage() {
  renderPeriodTabs();
  await loadFridgeStock();
  await loadItems();
  await buildCandidates();
}
initPage();
</script>
</body>
</html>
