<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食材ストック帳</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <a class="home-link" href="index.html" aria-label="ポータルに戻る">⌂</a>
      <div>
        <div class="eyebrow">KEEP TRACK, USE FIRST</div>
        <h1>食材ストック帳</h1>
      </div>
    </div>
    <div class="count-badge">
      <div class="count-num" id="totalCount">-</div>
      <div class="count-label">件を保管中</div>
    </div>
  </div>

  <div class="check-box" style="background:#fff; border-radius:14px; padding:14px 14px 12px; box-shadow:0 2px 10px rgba(27,122,140,0.08); margin-bottom:14px; border:1px solid #DCEFF0;">
    <div style="font-size:12px; color:#3E6B72; font-weight:700; margin-bottom:6px;">買い物前チェック — もう家にある？</div>
    <input id="checkInput" placeholder="食材名を入力（例：にんじん）">
    <div id="checkResults"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="loading">読み込み中…</div></div>
  <div class="error-banner" id="errorBanner"></div>
  <button class="fab" id="fabAdd" aria-label="食材を追加">＋</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal fade" id="modalBox">
      <div class="modal-title" id="modalTitle">食材を追加</div>

      <label class="field-label">食材名</label>
      <input id="fName" placeholder="例：玉ねぎ（みじん切り）">
      <div class="warning-box" id="dupWarning"></div>

      <label class="field-label">数量</label>
      <input id="fQuantity" placeholder="例：2袋、200g、3個">

      <label class="field-label">保存場所</label>
      <div class="choice-row" id="locChoices"></div>

      <label class="checkbox-row">
        <input type="checkbox" id="fIsCut" style="width:16px;height:16px;">
        カット済みで保存する
      </label>

      <label class="field-label">保存日</label>
      <input type="date" id="fDate">

      <label class="field-label">メモ（任意）</label>
      <textarea id="fMemo" style="height:56px; resize:none;" placeholder="例：味噌汁用にカット"></textarea>

      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">キャンセル</button>
        <button class="btn-save" id="btnSave">追加する</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/site-config.js"></script>
<script src="assets/api.js"></script>
<script>
const SHEET = "FridgeItems";
const LOCATIONS = [
  { id: "freezer", label: "冷凍", color: "#1B7A8C", icon: "❄", oldAfter: 30 },
  { id: "fridge", label: "冷蔵", color: "#4A7FB5", icon: "○", oldAfter: 5 },
  { id: "vegetable", label: "野菜室", color: "#5C8A4E", icon: "△", oldAfter: 5 },
  { id: "pantry", label: "常温", color: "#B98A3D", icon: "▢", oldAfter: 60 },
  { id: "seasoning", label: "調味料", color: "#8A5FBF", icon: "✦", oldAfter: 180 },
];

let items = [];
let filter = "all";
let editingId = null;
let formLocation = "freezer";

function locationInfo(id) { return LOCATIONS.find(l => l.id === id) || LOCATIONS[0]; }
function todayISO() { const d = new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function daysSince(dateStr) {
  const then = new Date(dateStr + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - then) / 86400000));
}
function fmtDate(dateStr) { const d = new Date(dateStr + "T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}`; }
function normalize(s) { return (s||"").toString().trim().toLowerCase(); }
function escapeHtml(s) { return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toBool(v) { return v === true || v === "true" || v === "TRUE"; }

function frostSVG(days, color, oldAfter) {
  const ratio = days / (oldAfter || 30);
  const level = ratio >= 1 ? 3 : ratio >= 0.66 ? 2 : ratio >= 0.33 ? 1 : 0;
  const arms = [0,60,120,180,240,300];
  let inner = "";
  arms.forEach(deg => {
    inner += `<g transform="rotate(${deg})"><line x1="0" y1="0" x2="0" y2="${-9 - level*1.2}" stroke="${color}" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>`;
    if (level >= 1) inner += `<line x1="0" y1="-5" x2="2.4" y2="-6.6" stroke="${color}" stroke-width="1" opacity="0.75" stroke-linecap="round"/><line x1="0" y1="-5" x2="-2.4" y2="-6.6" stroke="${color}" stroke-width="1" opacity="0.75" stroke-linecap="round"/>`;
    if (level >= 2) inner += `<line x1="0" y1="-8" x2="2" y2="-9.4" stroke="${color}" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/><line x1="0" y1="-8" x2="-2" y2="-9.4" stroke="${color}" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>`;
    inner += `</g>`;
  });
  const circleR = level >= 3 ? 3 : 2;
  const circleOp = level >= 3 ? 0.5 : 0.35;
  return `<svg width="26" height="26" viewBox="0 0 26 26" style="flex-shrink:0;"><g transform="translate(13,13)">${inner}<circle r="${circleR}" fill="${color}" opacity="${circleOp}"/></g></svg>`;
}

function showError(msg) {
  const el = document.getElementById("errorBanner");
  if (!msg) { el.style.display = "none"; return; }
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function loadItems() {
  try {
    const data = await Api.list(SHEET);
    items = data.map(it => ({ ...it, isCut: toBool(it.isCut) }));
  } catch (e) {
    showError("読み込みに失敗しました: " + e.message);
    items = [];
  }
  renderAll();
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  let html = `<div class="tab ${filter==='all'?'active':''}" data-filter="all">すべて</div>`;
  LOCATIONS.forEach(l => {
    const active = filter === l.id;
    html += `<div class="tab ${active?'active':''}" data-filter="${l.id}" style="${active?`background:${l.color};border-color:${l.color};`:''}">${l.icon} ${l.label}</div>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { filter = t.dataset.filter; renderAll(); }));
}

function renderList() {
  const listEl = document.getElementById("list");
  const filtered = filter === "all" ? items : items.filter(i => i.location === filter);
  document.getElementById("totalCount").textContent = items.length;

  if (items.length === 0) {
    listEl.innerHTML = `<div class="empty-state">まだ何も登録されていません。<br>右下の「＋」から食材を追加しましょう。</div>`;
    return;
  }
  let html = "";
  LOCATIONS.filter(l => filter === "all" || filter === l.id).forEach(loc => {
    const arr = filtered.filter(i => i.location === loc.id).sort((a,b) => daysSince(b.date) - daysSince(a.date));
    if (arr.length === 0) return;
    html += `<div style="margin-bottom:18px;"><div style="font-size:13px;font-weight:900;margin-bottom:6px;color:${loc.color};">${loc.icon} ${loc.label}（${arr.length}）</div>`;
    arr.forEach(it => {
      const d = daysSince(it.date);
      const isOld = d >= (loc.oldAfter ?? 30);
      html += `<div class="card" data-id="${it.id}">
        ${frostSVG(d, loc.color, loc.oldAfter)}
        <div style="flex:1; min-width:0;">
          <div class="card-name">${escapeHtml(it.name)}${it.isCut ? '<span class="tag">カット済</span>' : ''}</div>
          <div class="card-meta ${isOld?'old':''}">${escapeHtml(it.quantity)||"数量未記入"} ・ ${fmtDate(it.date)}から${d}日 ${isOld?'・そろそろ使い切ろう':''}</div>
          ${it.memo ? `<div class="card-memo">${escapeHtml(it.memo)}</div>` : ''}
        </div>
        <button class="small-btn" data-remove="${it.id}">使い切った</button>
      </div>`;
    });
    html += `</div>`;
  });
  listEl.innerHTML = html;

  listEl.querySelectorAll(".card").forEach(card => card.addEventListener("click", (e) => {
    if (e.target.dataset.remove) return;
    const item = items.find(i => i.id === card.dataset.id);
    if (item) openEdit(item);
  }));
  listEl.querySelectorAll("[data-remove]").forEach(btn => btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    btn.textContent = "…";
    try { await Api.remove(SHEET, btn.dataset.remove); await loadItems(); }
    catch (err) { showError("削除に失敗しました: " + err.message); }
  }));
}

function renderCheck() {
  const q = normalize(document.getElementById("checkInput").value);
  const el = document.getElementById("checkResults");
  if (!q) { el.innerHTML = ""; return; }
  const hits = items.filter(it => normalize(it.name).includes(q));
  if (hits.length === 0) { el.innerHTML = `<div class="fade" style="font-size:13px;color:#5C8A4E;font-weight:700;padding:6px 2px;">在庫なし。買ってOKです。</div>`; return; }
  let html = `<div class="fade">`;
  hits.forEach(it => {
    const loc = locationInfo(it.location);
    const d = daysSince(it.date);
    html += `<div class="card" style="border:1.5px solid ${loc.color}; cursor:default;">
      ${frostSVG(d, loc.color, loc.oldAfter)}
      <div style="flex:1;">
        <div style="font-weight:700; color:#16333A;">${escapeHtml(it.name)}${it.isCut ? '<span class="tag">カット済</span>' : ''}</div>
        <div style="font-size:12px; color:#6B8B90;">${loc.icon} ${loc.label}・${escapeHtml(it.quantity)||"数量未記入"}・${d}日前から保存</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

function renderLocChoices() {
  const el = document.getElementById("locChoices");
  el.innerHTML = LOCATIONS.map(l => {
    const active = formLocation === l.id;
    return `<div class="choice ${active?'active':''}" data-loc="${l.id}" style="${active?`background:${l.color};border-color:${l.color};color:#fff;`:''}">${l.icon} ${l.label}</div>`;
  }).join("");
  el.querySelectorAll(".choice").forEach(c => c.addEventListener("click", () => { formLocation = c.dataset.loc; renderLocChoices(); }));
}

function renderDupWarning() {
  const q = normalize(document.getElementById("fName").value);
  const warnEl = document.getElementById("dupWarning");
  if (!q || editingId) { warnEl.style.display = "none"; return; }
  const dups = items.filter(it => normalize(it.name).includes(q) || q.includes(normalize(it.name)));
  if (dups.length === 0) { warnEl.style.display = "none"; return; }
  warnEl.innerHTML = "⚠ すでに似た食材があります：" + dups.map(d =>
    `<div style="margin-top:2px;">・${escapeHtml(d.name)}（${locationInfo(d.location).label}・${daysSince(d.date)}日前・${escapeHtml(d.quantity)||"数量未記入"}）</div>`
  ).join("");
  warnEl.style.display = "block";
}

function openAdd() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "食材を追加";
  document.getElementById("fName").value = "";
  document.getElementById("fQuantity").value = "";
  document.getElementById("fIsCut").checked = false;
  document.getElementById("fDate").value = todayISO();
  document.getElementById("fMemo").value = "";
  formLocation = "freezer";
  renderLocChoices();
  document.getElementById("dupWarning").style.display = "none";
  document.getElementById("btnSave").textContent = "追加する";
  openModal();
}
function openEdit(item) {
  editingId = item.id;
  document.getElementById("modalTitle").textContent = "食材を編集";
  document.getElementById("fName").value = item.name;
  document.getElementById("fQuantity").value = item.quantity || "";
  document.getElementById("fIsCut").checked = !!item.isCut;
  document.getElementById("fDate").value = item.date;
  document.getElementById("fMemo").value = item.memo || "";
  formLocation = item.location;
  renderLocChoices();
  document.getElementById("dupWarning").style.display = "none";
  document.getElementById("btnSave").textContent = "更新する";
  openModal();
}
function openModal() { document.getElementById("modalOverlay").classList.add("open"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("open"); }

async function saveForm() {
  const name = document.getElementById("fName").value.trim();
  if (!name) return;
  const data = {
    name,
    quantity: document.getElementById("fQuantity").value.trim(),
    location: formLocation,
    isCut: document.getElementById("fIsCut").checked,
    date: document.getElementById("fDate").value || todayISO(),
    memo: document.getElementById("fMemo").value.trim(),
  };
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  try {
    if (editingId) await Api.update(SHEET, editingId, data);
    else await Api.add(SHEET, data);
    closeModal();
    await loadItems();
  } catch (err) {
    showError("保存に失敗しました: " + err.message);
  } finally {
    btn.disabled = false;
  }
}

function renderAll() { renderTabs(); renderList(); renderCheck(); }

document.getElementById("fabAdd").addEventListener("click", openAdd);
document.getElementById("btnCancel").addEventListener("click", closeModal);
document.getElementById("btnSave").addEventListener("click", saveForm);
document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") closeModal(); });
document.getElementById("checkInput").addEventListener("input", renderCheck);
document.getElementById("fName").addEventListener("input", renderDupWarning);

loadItems();
</script>
</body>
</html>
